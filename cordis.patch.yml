# dsh-plugin-imom-mes — bundle layer.
#
# Generated by the dsh-mcp-connector-builder skill (scaffold.mjs) from spec.json.
# Regenerate instead of hand-editing: the plugin page form is driven by the same spec.
#
# Connection values are credential REFERENCES, so no secret is stored in this file:
#   MOM_MES_API_KEY

- insert:
    # The MCP connection itself.
    - id: imom-mes
      name: '@deepseek-ai/dsh-mcp-client'
      # Required: ${credential:…} templates resolve through the credentials provider,
      # and a service is visible to a fiber only when the row injects it. Without
      # this line the row fails with "MCP credential templates require a credentials provider".
      inject: [credentials]
      config:
        serverName: imomMes
        transport: streamable-http
        url: 'https://mom-mes-connector-t.hdt.cosmoplat.com/mcp'
        headers:
          Authorization: 'Bearer ${credential:MOM_MES_API_KEY}'
        # Resolve ${credential:…} at runtime and redact resolved values from diagnostics.
        # A missing value leaves the server in `waiting-credentials` instead of burning reconnect attempts.
        expandTemplates: true
        failOnStartupError: false

    # The bundle's own row: it carries the browser half (the configuration form
    # on the bundle page) and gives the package a Loader entry of its own.
    - id: imom-mes-bundle
      name: 'dsh-plugin-imom-mes'
